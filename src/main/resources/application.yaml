spring:
  application:
    name: enali
  # fotos de produto e do pedido aceitam até 5 MB cada (o padrão do Spring é 1 MB)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
